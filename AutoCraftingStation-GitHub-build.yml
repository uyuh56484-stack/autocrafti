name: Build Auto Crafting Station

# Автоматический запуск при любом push и Pull Request.
# workflow_dispatch добавляет кнопку ручного запуска в GitHub Actions.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autocraftingstation-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Minecraft mod (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get source code
        uses: actions/checkout@v6

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'

      - name: Show build environment
        run: |
          java -version
          gradle --version

      - name: Build mod JAR
        run: gradle clean build --no-daemon --stacktrace

      - name: Check that the JAR was created
        shell: bash
        run: |
          set -euo pipefail
          ls -lah build/libs
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Upload compiled mod
        uses: actions/upload-artifact@v7
        with:
          name: AutoCraftingStation-1.0.0
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
